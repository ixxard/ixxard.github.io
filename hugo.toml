# ─────────────────────────────────────────────────────────────────────────────
#  Make it yours: everything personal lives in this block and in [params].
# ─────────────────────────────────────────────────────────────────────────────
baseURL      = "https://sankrant.systems/"   # CI uses the domain set in GitHub Pages
title        = "Sankrant's Tech Blog"        # browser tab, feeds, share cards
locale       = "en-us"

# (machinery: must sit above the first [table] in TOML)
enableRobotsTXT      = true
summaryLength        = 30
capitalizeListTitles = false   # tags stay as you typed them: #arm64, not #Arm64
ignoreFiles          = ['(^|/)\.obsidian/', '(^|/)\.trash/', '(^|/)_templates/']   # Obsidian's own files

[params]
  author      = "Sankrant Chaubey"

  # Wordmark in the top-left corner and the big name on the home page. Plain text,
  # or wrap a piece in <em> to paint it in the accent colour.
  brand       = "Sankrant's <em>Tech Blog</em>"

  # One or two lines under your name on the home page. Markdown is fine.
  bio         = "I focus mostly on systems programming, optimization, security research and the demoscene."

  # Used for search engines and share cards when a page has no description.
  description = "Sankrant Chaubey on how systems work: systems programming, optimization, security research and the demoscene."

  # One colour drives links, highlights, the reading bar and share cards.
  # Some that work in both themes: "#5ee6c0" mint, "#ff7a45" ember,
  # "#7aa2ff" signal blue, "#f5c542" sodium, "#ff6ad5" magenta.
  accent       = "#5ee6c0"
  defaultTheme = "auto"            # auto | dark | light   (readers can still toggle with t)

  # Where this site's source lives: powers "view on GitHub" links on code.
  repo   = "https://github.com/ixxard/ixxard.github.io"
  branch = "main"

  ogImages    = true  # draw a share card (1200x630) for every post

  # Page views at https://ixxard.goatcounter.com (no cookies). Live site only; remove to turn off.
  goatcounter = "https://ixxard.goatcounter.com/count"
  notesOnHome = 8     # how many recent notes the home page lists

  # Links shown under your bio and in the footer. Add, remove, reorder.
  # (Keep these last in [params]: in TOML, keys after [[...]] belong to it.)
  [[params.links]]
    name = "github"
    url  = "https://github.com/ixxard"
  [[params.links]]
    name = "x"
    url  = "https://x.com/snk_xed"
  [[params.links]]
    name = "bluesky"
    url  = "https://bsky.app/profile/ixx.bsky.social"
  [[params.links]]
    name = "rss"
    url  = "/index.xml"

  # Writing published somewhere else: a small "elsewhere" list in the home page's side rail.
  [[params.elsewhere]]
    title = "ARM64 Decompilation with Prolog"
    venue = "Paged Out! #8 · p. 71"
    url   = "https://pagedout.institute/webview.php?issue=8&page=71&article=ARM64+Decompilation+with+Prolog"

# Top navigation. Add, remove or reorder freely.
[[menus.main]]
  name = "series"
  pageRef = "/series"
  weight = 10
[[menus.main]]
  name = "notes"
  pageRef = "/notes"
  weight = 20
[[menus.main]]
  name = "tags"
  pageRef = "/tags"
  weight = 30
# "about" adds itself from content/about.md once that page is not a draft.

# ─────────────────────────────────────────────────────────────────────────────
#  Machinery. You shouldn't need to touch anything below.
# ─────────────────────────────────────────────────────────────────────────────
[taxonomies]
  tag = "tags"

[services.rss]
  limit = 40

[markup]
  [markup.goldmark.renderer]
    unsafe = true                 # raw HTML and inline <svg> are allowed in posts
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.parser.attribute]
      block = true
      title = true
  [markup.highlight]
    noClasses          = false    # colours come from main.css, so they follow the theme
    lineNumbersInTable = false
    guessSyntax        = false
    tabWidth           = 4
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3

[minify.tdewolff.html]
  keepWhitespace = false
