{{ define "main" }}
<div class="wrap">
  <header class="list-head"><h1>{{ .Title | lower }}</h1></header>
  <ul class="tag-cloud">
    {{- range .Data.Terms.Alphabetical }}
    <li><a href="{{ .Page.RelPermalink }}">#{{ .Page.LinkTitle }}</a><sup>{{ .Count }}</sup></li>
    {{- else }}
    <li class="empty">No tags yet.</li>
    {{- end }}
  </ul>
</div>
{{ end }}
