{{- $p := .page -}}
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:title" content="{{ $p.Title | default site.Title }}">
<meta property="og:description" content="{{ .desc }}">
<meta property="og:url" content="{{ $p.Permalink }}">
<meta property="og:type" content="{{ if $p.IsPage }}article{{ else }}website{{ end }}">
{{- if $p.IsPage }}
<meta property="article:published_time" content="{{ $p.Date.Format "2006-01-02T15:04:05Z07:00" }}">
{{- end }}
{{- with partial "og-image.html" $p }}
<meta property="og:image" content="{{ .Permalink }}">
<meta property="og:image:width" content="{{ .Width }}">
<meta property="og:image:height" content="{{ .Height }}">
<meta name="twitter:card" content="summary_large_image">
{{- else }}
<meta name="twitter:card" content="summary">
{{- end }}
