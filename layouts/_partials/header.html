<header class="site-header">
  <div class="bar">
    <a class="brand" href="{{ "/" | relURL }}" rel="home">{{ site.Params.brand | default site.Title | safeHTML }}<span class="cursor" aria-hidden="true"></span></a>
    <nav class="nav" aria-label="Main">
      {{- $cur := . }}
      {{- range site.Menus.main }}
      <a href="{{ .URL | relURL }}"{{ if or ($cur.IsMenuCurrent "main" .) ($cur.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
      <button class="theme-toggle" type="button" aria-label="Toggle colour theme" title="Toggle theme (t)">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg>
      </button>
    </nav>
  </div>
</header>
